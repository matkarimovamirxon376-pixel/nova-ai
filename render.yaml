# Render.com uchun NOVA AI konfiguratsiyasi.
# Bu fayl loyihani internetga chiqarishni avtomatlashtiradi.
#
# Qanday ishlatiladi:
#  1. Loyihani GitHub repozitoriyasiga joylang (yoki Render'ning "Deploy" tugmasi orqali).
#  2. Render'da "New +" -> "Blueprint" -> ushbu repo'ni tanlang. Render bu
#     render.yaml faylini avtomatik o'qiydi.
#  3. Render sizdan GROQ_API_KEY qiymatini so'raydi (chunki u "sync: false").
#     Kalitni O'SHA YERGA kiriting — u kodda yoki GitHub'da saqlanmaydi.
#
# Hech qanday pullik xizmat shart emas: "plan: free" bepul rejadan foydalanadi.

services:
  - type: web
    name: nova-ai
    # Docker ishlatamiz (Dockerfile mavjud). Zero-dependency bo'lgani uchun
    # image juda yengil.
    runtime: docker
    plan: free
    autoDeploy: true
    # Render shu manzilni tekshirib, server tirik ekanini biladi. Server'da
    # /api/health allaqachon mavjud (200 qaytaradi). Busiz Render ba'zan
    # serverni noto'g'ri "ishlamayapti" deb to'xtatishi mumkin.
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      # Render serverga shu PORT raqamini beradi; server uni o'qiydi.
      - key: PORT
        value: "10000"
      # API kaliti: Render panelida qo'lda kiritiladi. Kodga YOZILMAYDI.
      - key: GROQ_API_KEY
        sync: false
